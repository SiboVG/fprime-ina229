name: INA229 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: cmake -S tests -B build-host
      - run: cmake --build build-host --parallel 4
      - run: ctest --test-dir build-host --output-on-failure
      - run: python -m unittest discover -s tests -p test_bridge.py
      - name: Evidence manifest matches sources
        run: python tests/check_evidence.py
  sanitizers-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: >-
          cmake -S tests -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-san --parallel 4
      - run: ctest --test-dir build-san --output-on-failure
      - run: python -m pip install gcovr==8.2
      - run: cmake -S tests -B build-coverage -DINA229_COVERAGE=ON
      - run: cmake --build build-coverage --parallel 4
      - run: ctest --test-dir build-coverage --output-on-failure
      - run: >-
          python -m gcovr --root . --object-directory build-coverage
          --filter 'Ina229/Device/' --txt --txt-metric branch --txt-summary
          --exclude-throw-branches --exclude-unreachable-branches
          --fail-under-line 90 --fail-under-branch 90
  fprime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nasa/fprime
          ref: 35d4c0e881482adf372b8eee3eb56ad2dee74618
          path: fprime
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r fprime/requirements.txt
      - run: >-
          cmake -S tests/fprime-consumer -B build-components
          -DFPRIME_FRAMEWORK_PATH="$GITHUB_WORKSPACE/fprime"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build build-components --target Ina229_Manager_ut_exe --parallel 4
      - run: build-components/bin/Linux/Ina229_Manager_ut_exe
      - run: >-
          cmake -S examples/Ft232h -B build-ft232h
          -DFPRIME_FRAMEWORK_PATH="$GITHUB_WORKSPACE/fprime"
      - run: cmake --build build-ft232h --target Deployment --parallel 4
      - run: INA229_DEMO="$PWD/build-ft232h/bin/Linux/Deployment" python tests/test_deployment.py
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nasa/fprime
          ref: 35d4c0e881482adf372b8eee3eb56ad2dee74618
          path: fprime
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r fprime/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache pinned cppcheck
        uses: actions/cache@v6
        with:
          path: ~/.local/cppcheck-2.22.0
          key: cppcheck-2.22.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cppcheck and clang-tidy
        run: |
          sh scripts/install-cppcheck.sh
          echo "CPPCHECK=$HOME/.local/cppcheck-2.22.0/bin/cppcheck" >> "$GITHUB_ENV"
          pipx install clang-tidy==22.1.8
      - name: Static analysis (cppcheck + clang-tidy, zero findings)
        env:
          FPRIME_FRAMEWORK_PATH: ${{ github.workspace }}/fprime
        run: python3 scripts/static_analysis.py --build host --build ft232h
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict --clean
